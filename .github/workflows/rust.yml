name: Rust verification
# Phase 0/1 のworkspaceを検証する。リモートCIは未実行である
# （docs/implementation-status.md を正とする）。
on:
  push:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'icp.yaml'
      - 'scripts/**'
      - 'tools/**'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'icp.yaml'
      - 'scripts/**'
      - 'tools/**'
      - '.github/workflows/rust.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          # rust-toolchain.toml と同じ版に固定する。
          toolchain: '1.97.0'
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Format
        run: cargo fmt --all --check
      - name: Lint (host, whole workspace)
        # 既定メンバーだけでは crates/pocket-ic-tests が漏れるため --workspace を使う。
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test (host, default members)
        run: cargo test
      - name: Forbid async in hl-sign and db
        run: bash scripts/check-no-await.sh
      - name: Forbid raw-key signing in canister crates
        run: bash scripts/check-signing-boundary.sh
      - name: Lint (wasm canisters)
        run: cargo clippy --target wasm32-unknown-unknown -p policy -p funds-vault -p control-guard -p trading-core -- -D warnings
      - name: Build canister wasm
        run: cargo build --release --target wasm32-unknown-unknown -p policy -p funds-vault -p control-guard -p trading-core
  pocket-ic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.0'
          targets: wasm32-unknown-unknown
      # PocketICサーバ（pocket-ic-x86_64-linux.gz）を取得し、
      # wasmビルド → crates/pocket-ic-tests の試験を実行する。
      - name: PocketIC integration tests
        run: bash scripts/pocket-ic-test.sh
      # 公式SDKのfixtureはコミット済み。生成器はネットワークとpnpmを要するため
      # CIでは再生成せず、固定したfixtureとの一致だけを検証する。
      - name: Official SDK fixture comparison
        run: cargo test -p hl-sign --test fixtures
