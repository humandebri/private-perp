name: Rust verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    name: Rust verification
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # Toolchain version pinned below
        with:
          toolchain: '1.97.0'
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Format
        run: cargo fmt --all --check
      - name: Lint (host, pure crates and test harness)
        run: cargo clippy --locked --workspace --all-targets --exclude funds-vault --exclude trading-core --exclude control-guard --exclude policy --exclude send-journal --exclude journal-client --exclude private-perp -- -D warnings
      - name: Test (host, pure crates and test harness)
        run: cargo test --locked --workspace --exclude pocket-ic-tests --exclude funds-vault --exclude trading-core --exclude control-guard --exclude policy --exclude send-journal --exclude journal-client --exclude private-perp
      - name: Forbid async in hl-sign and db
        run: bash scripts/check-no-await.sh
      - name: Test close price precision
        run: bash scripts/test-close-price.sh
      - name: Forbid raw-key signing in canister crates
        run: bash scripts/check-signing-boundary.sh
      - name: Lint (standalone wasm canisters)
        run: cargo clippy --locked --all-targets --target wasm32-unknown-unknown -p policy -p funds-vault -p control-guard -p trading-core -p send-journal -p db -- -D warnings
      - name: Lint (unified wasm canister)
        run: cargo clippy --locked --all-targets --target wasm32-unknown-unknown -p private-perp -- -D warnings
      - name: Build standalone canister wasm
        run: cargo build --locked --release --target wasm32-unknown-unknown -p policy -p funds-vault -p control-guard -p trading-core -p send-journal
      - name: Build unified canister wasm
        run: cargo build --locked --release --target wasm32-unknown-unknown -p private-perp
      - name: Check the deployable wasm has no test-only entry points
        run: |
          set -euo pipefail
          for wasm in target/wasm32-unknown-unknown/release/policy.wasm \
                      target/wasm32-unknown-unknown/release/funds_vault.wasm \
                      target/wasm32-unknown-unknown/release/control_guard.wasm \
                      target/wasm32-unknown-unknown/release/trading_core.wasm \
                      target/wasm32-unknown-unknown/release/private_perp.wasm; do
            test -f "$wasm"
            for method in test_credit_deposit test_corrupt_action_digest test_hpke_seal \
                          test_hpke_open test_ecdsa_roundtrip test_sweep_now test_ingest_fills \
                          test_apply_order_status test_sign_order_action \
                          test_set_outbox_fault test_outbox_atomicity_snapshot; do
              if grep -q "$method" "$wasm"; then
                echo "$wasm contains test-only method $method" >&2
                exit 1
              fi
            done
          done
  pocket-ic:
    name: PocketIC integration
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # Toolchain version pinned below
        with:
          toolchain: '1.97.0'
          targets: wasm32-unknown-unknown
      - name: PocketIC integration tests
        run: bash scripts/pocket-ic-test.sh --no-fail-fast
      - name: PocketIC runner failure propagation
        if: always()
        run: node --test scripts/pocket-ic-runner.test.mjs scripts/fetch-pocket-ic.test.mjs
      - name: Official SDK fixture comparison
        run: cargo test --locked -p hl-sign --test fixtures
