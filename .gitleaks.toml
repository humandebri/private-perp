[extend]
useDefault = true

[[allowlists]]
description = "Public Anvil accounts used only for deterministic SDK signing fixtures"
condition = "AND"
paths = [
  '^crates/hl-sign/tests/fixtures/.*\.json$',
  '^tools/hl-fixture-gen/generate\.mjs$',
]
regexTarget = "secret"
regexes = [
  '^0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d$',
  '^0x5de4111afa1a4b94908f83103eb1f1706367c2e68ca870fc3fb9a804cdab365a$',
]
