[workspace]
resolver = "3"
members = [
    "crates/hl-types",
    "crates/hl-sign",
    "crates/api-types",
    "crates/db",
    "crates/policy",
    "crates/funds-vault",
    "crates/control-guard",
    "crates/trading-core",
    "crates/pocket-ic-tests",
]
# ホストで実行できる純粋クレートのみを既定の対象にする。
# Canisterクレートと `db` の実装は wasm32 ビルドでのみ検証する（Implementation.md 3.2、3.3）。
# `pocket-ic-tests` はPocketICサーバを必要とするため既定の対象から外す。
default-members = ["crates/hl-types", "crates/hl-sign", "crates/api-types", "crates/db"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

# 依存は完全固定する（Implementation.md 4.1、14.1）。Cargo.lock をコミットする。
[workspace.dependencies]
candid = "=0.10.35"
hex = "=0.4.3"
ic-cdk = "=0.20.3"
ic-cdk-management-canister = "=0.2.0"
ic-management-canister-types = "=0.10.0"
ic-sqlite-vfs = { version = "=2.0.0", default-features = false, features = ["sqlite-precompiled"] }
k256 = { version = "=0.14.0", default-features = false, features = ["arithmetic", "ecdsa"] }
pocket-ic = "=16.0.0"
rmp-serde = "=1.3.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_bytes = "=0.11.19"
serde_json = "=1.0.151"
sha2 = "=0.11.0"
sha3 = "=0.12.0"
# `pocket-ic 16.0.0` が `thiserror =2.0.18` を要求するため、同一メジャー内で
# 1バージョンしか選べない制約に合わせて 2.0.18 へ揃える。
thiserror = "=2.0.18"

