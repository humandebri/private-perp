[workspace]
resolver = "3"
members = [
    "crates/hl-types",
    "crates/hl-sign",
    "crates/api-types",
    "crates/db",
    "crates/hpke-envelope",
    "crates/policy",
    "crates/funds-vault",
    "crates/control-guard",
    "crates/send-journal",
    "crates/journal-client",
    "crates/trading-core",
    "crates/pocket-ic-tests",
    "crates/scoped-entrypoint",
    "crates/private-perp",
    "tools/e2e-signer",
    "tools/eligibility-issuer",
]
# Default members run on the host. Canister implementations require Wasm builds.
# PocketIC integration tests are run separately with their server.
default-members = ["crates/hl-types", "crates/hl-sign", "crates/api-types", "crates/db"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "MIT"
repository = "https://github.com/humandebri/private-perp"

# Pin dependency versions and commit Cargo.lock for reproducibility.
[workspace.dependencies]
candid = "=0.10.35"
hex = "=0.4.3"
ic-cdk = "=0.20.3"
ic-cdk-management-canister = "=0.2.0"
ic-cdk-timers = "=1.0.0"
ic-sqlite-vfs = { version = "=2.0.0", default-features = false, features = ["sqlite-precompiled"] }
k256 = { version = "=0.14.0", default-features = false, features = ["arithmetic", "ecdsa"] }
pocket-ic = "=16.0.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_bytes = "=0.11.19"
serde_json = "=1.0.151"
sha2 = "=0.11.0"
rand_core = "=0.10.1"
hpke = { version = "=0.14.1", default-features = false, features = ["alloc", "x25519", "chacha"] }
sha3 = "=0.12.0"
# Match the thiserror version required by pocket-ic 16.0.0.
thiserror = "=2.0.18"
