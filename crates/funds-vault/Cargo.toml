[package]
name = "funds-vault"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "funds_vault Canister（認証・台帳・資金outbox）"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
api-types = { path = "../api-types" }
candid.workspace = true
db = { path = "../db" }
hpke-envelope = { path = "../hpke-envelope" }
ic-sqlite-vfs.workspace = true
hl-sign = { path = "../hl-sign" }
hl-types = { path = "../hl-types" }
journal-client = { path = "../journal-client" }
hex.workspace = true
ic-cdk.workspace = true
ic-cdk-management-canister.workspace = true
ic-cdk-timers.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["arbitrary_precision"] }

[features]
# テスト専用の入金計上（`test_credit_deposit`）を有効にする。
# 本番ビルド（`icp build`、CIのwasmビルド）では有効にしない。
default = []
test-venue = []
