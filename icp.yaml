# canister build/deploy configuration (icp-cli)
#
# 統合 Canister の build 設定。Canister ID はデプロイ先ごとに確定する。
# frontend は Cloudflare Workers 配信なのでここには定義しない。
canisters:
  - name: private_perp
    recipe:
      type: "@dfinity/rust@v3.2.0"
      configuration:
        package: private-perp

networks:
  - name: local
    mode: managed
    gateway:
      port: 18100
